# MettaOS — GRUB Multiboot2 + framebuffer lineal

set timeout=0
set default=0

insmod all_video
set gfxpayload=1024x768x32

menuentry "MettaOS" {
    multiboot2 /boot/mettaos.bin
    boot
}

menuentry "MettaOS - pruebas de compatibilidad Linux" {
    multiboot2 /boot/mettaos.bin linux-selftest
    boot
}
